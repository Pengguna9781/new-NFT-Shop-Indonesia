<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM Challenge</title>
    <style>
        /* These are the two states your JS will toggle between */
        body {
            background-color: white;
            color: black;
            font-family: sans-serif;
            transition: background 0.3s; /* Makes the transition smooth */
        }
        
        body.dark-mode {
            background-color: #222222;
            color: white;
        }
    </style>
</head>
<body>

    <button id="themeBtn">Toggle Dark Mode</button>
    <h1>Welcome to my website</h1>
    <p>This text will change colors when you click the button above.</p>

    <script>
        const idThemeBtn = document.querySelector("#themeBtn")

        const tagBody = document.querySelector("body")

        idThemeBtn.addEventListener("click", function() {
            document.body.classList.toggle("dark-mode")
        })
    </script>

</body>
</html>
