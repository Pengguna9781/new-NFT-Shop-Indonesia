<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="DIY.css" type="text/css">
</head>
<body>
    <header>
        <div class="navbar-container">
            <ul class="navbar">
                <li class="home-button"><a href="index.html">Home</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="about-page.html">About</a></li>
                <li><a href="quizzlet.html">Quizzlet</a></li>
            </ul>
        </div>
    </header>
    <main>
        <form action="contact.html" autocomplete="off">
            <div class="form-container"></div>
            <!-- Input Name Column -->
            <div class="input-container">
                <div class="form-input">
                    <i class="fas fa-user"></i>
                    <label for="name" class="form-label">Name</label><br>
                    <input class="input-item" type="text" name="name" id="name" placeholder="">
                </div>
            </div>

            <!-- Input City Column -->
            <div class="input-container">
                <div class="form-input">
                    <i class="fas fa-map-marker-alt"></i>
                    <label for="name" class="form-label">City</label><br>
                    <input class="input-item" type="text" name="city" id="city" placeholder="">
                </div>

            <!-- Input Email Column -->
            <div class="input-container">
                <div class="form-input">
                    <i class="fas fa-envelope-open"></i>
                    <label for="name" class="form-label">Email</label><br>
                    <input class="input-item" type="text" name="email" id="email" placeholder="">
                </div>

            <!-- Input Message Column -->
            <div class="input-container">
                <div class="form-textarea">
                    <i class="fas fa-comment"></i>
                    <label for="name" class="form-label">Message</label><br>
                    <textarea class="textarea" type="text" name="message" id="message" cols="52" rows="8" placeholder=""></textarea>
                </div>
            </div>
            <input type="submit" value="Submit" class="submit">
        </form>
