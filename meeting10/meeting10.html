<body>
    <button onclick="playMusic()">Play Music</button>
    <!-- Mouse Events -->
    <!-- Event	        Description
    onclick	            Event onclick adalah event ketika suatu elemen di klik satu kali.
    ondblclick	        Event ondblclick adalah event ketika suatu elemen di klik dua kali.
    onmouseover	        Event onmouseover adalah event ketika mouse diarahkan ke atas elemen.
    onmouseout	        Event onmouseout adalah event setelah mouse berada di luar elemen.
    onmousedown	        Event onmousedown adalah event ketika mouse sedang menekan elemen (klik lalu tahan)
    onmouseup	        Event onmouseup adalah event ketika mouse sudah tidak menekan elemen. -->

    <!-- Windows Event -->
    <!-- Event	        Description
    onload	            Event onload adalah event ketika masuk halaman web.
    onunload	        Event onunload adalah event ketika keluar halaman web.
    onscroll	        Event onscroll adalah event ketika halaman web di scroll.
    onresized	        Event onresized adalah event ketika halaman web berubah ukuran. -->

    <!-- Keyboarad Event -->
    <!-- Event	        Description
    onkeypress	        Event onkeypress adalah event ketika suatu keyboard sedang ditekan.
    onkeydown	        Event onkeydown adalah event ketika suatu keyboard ditekan.
    onkeyup	            Event onkeyup adalah event ketika suatu keyboard dilepaskan. -->


    <!-- Dynamic Object Manipulation Event Listener -->
    <!--DOM Event Listeners adalah event dengan kode addEventListener yang mengecek jika ada sebuah event yang terjadi. 
    Contoh jika Tagname h1 pergantian. Akan dideteksi oleh addEventListener. -->
    <!-- Contoh: -->
    <button class="dasButton">Event Listener</button>
    <script>
        let button = document.querySelector("button2");
        function alert() {
            alert('Hello World')
        }
        function consoleLog() {
            console.log("hello world!")
        }
        button.addEventListener("click", alert())
        button.addEventListener("click", consoleLog())
    </script>
    <script src="meeting10.js"></script>
</body>
